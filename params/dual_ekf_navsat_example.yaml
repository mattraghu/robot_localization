# For parameter descriptions, please refer to the template parameter files for each node.

ekf_filter_node_odom:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 0.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    # print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  false,  true]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 1
    imu0_remove_gravitational_acceleration: true
    imu0_twist_rejection_threshold: 0.8                #
    imu0_pose_rejection_threshold: 0.8                #
    imu0_linear_acceleration_rejection_threshold: 0.8 #

    use_control: false
    stamped_control: false
    control_timeout: 0.2

    smooth_lagged_data: true
    history_length: 20.0

ekf_filter_node_map:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 0.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    smooth_lagged_data: true
    history_length: 20.0
    debug: true
    debug_out_file: /home/kearfott/ros2_ws/file.txt

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: odometry/gps 
    odom0_config: [true,  true,  true,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    imu0: imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  false,  true]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
    imu0_twist_rejection_threshold: 0.8                #
    imu0_pose_rejection_threshold: 0.8                #
    imu0_linear_acceleration_rejection_threshold: 0.8  #
    # use_control: false
    # control_config: [true, false, false, false, false, true]
    use_control: false
    stamped_control: false
    control_timeout: 0.2


    reset_on_time_jump: true

navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: -1.0183259571
    yaw_offset: .47
    zero_altitude: false
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    print_diagnostics: true
    reset_on_time_jump: true

    # wait_for_datum: true
    # datum: [40.8531181, -74.336734, 0.00]
    smooth_lagged_data: true
    history_length: 20.0
