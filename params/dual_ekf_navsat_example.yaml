navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: -1.0183259571
    yaw_offset: .47 #.349 
    zero_altitude: false
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    print_diagnostics: true
    reset_on_time_jump: true

    wait_for_datum: true
    datum: [40.8531181, -74.336734, 0.00]
    smooth_lagged_data: true
    history_length: 20.0

csv_publisher:
  ros__parameters:
    gyro_file: "/media/kearfott/PBKFD-095/delta_ang.csv"
    accel_file: "/media/kearfott/PBKFD-095/delta_vel.csv"
    start_time_est: "2024-12-20 14:15:15"
    skip_until_est: "2024-12-20 14:50:14"
    plot_accels: true
    downsample_hz: 30.0

new_converter_node:
  ros__parameters:
    imu_topic_in: "/mems/raw" # IMU topic name
    imu_topic_out: "/mems/data" # Output IMU topic name
    camera_topic_in: "/camera/image_raw"
    camera_topic_out: "/camera/image"
    start_est_time: "2024-12-20 14:50:14" 
    downsample_hz: 30.0 
    imu_orientation_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01] # Covariance for IMU orientation
    imu_angular_velocity_covariance: [0.001, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.001] # Covariance for angular velocity
    imu_linear_acceleration_covariance: [0.001, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.001] # Covariance for linear acceleration
