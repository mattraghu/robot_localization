ekf_filter_node_odom:
  ros__parameters:
    frequency: 100.0
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: cool/data
    imu0_config: 
                  [false, false, false,
                  # true,  true,  true,
                  false,  false,  false,
                  false, false, false,
                  # false, false, false,
                  true,  true,  true,
                  true, false, true]
                  # true,  false,  true] 
    imu0_queue_size: 100
    imu0_remove_gravitational_acceleration: true
    # imu0_linear_acceleration_rejection_threshold: 0.25

    imu1: imu/data
    imu1_config:
                  [false, false, false,
                  # true,  true,  true,
                  false,  false,  false,
                  false, false, false,
                  # false, false, false,
                  false,  false,  false,
                  false, false, false]
                  # true,  false,  true] 
    imu1_remove_gravitational_acceleration: true

