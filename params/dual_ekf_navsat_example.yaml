navsat_transform:
  ros__parameters:
    frequency: 100.0
    # yaw_offset: -0.591592654  # offset in radians 2.55
    # yaw_offset: -1.92238898
    yaw_offset: 0.0 
    zero_altitude: true
    use_odometry_yaw: true

    # wait_for_datum: true
    # datum: [40.7362024,-74.1716354, 0.00]

    smooth_lagged_data: true
    history_length: 20.0

csv_publisher:
  ros__parameters:
    topic_name: "/cool/data"
    gyro_file: "/media/kearfott/PBKFD-0951/delta_ang.csv"
    accel_file: "/media/kearfott/PBKFD-0951/delta_vel.csv"
    start_time_est: "2024-12-20 14:15:15"
    skip_until_est: "2024-12-20 14:54:37.92"
    wait_for_service_trigger: true
    # downsample_hz: 100.0

    # Covariances for IMU
    imu_orientation_covariance: [-1.0, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    imu_angular_velocity_covariance: [0.0001, 0.0, 0.0, 0.0, 0.0001, 0.0, 0.0, 0.0, 0.0001]
    imu_linear_acceleration_covariance: [0.01, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.01]

    export_csv: false
    orientation_topic: "/imu/data"
    initial_orientation_rpy: [0.0141371669, -0.0895353906, 0.0174532925]

