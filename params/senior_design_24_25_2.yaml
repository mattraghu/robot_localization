# -------------------------------
#         EKF  ➜  ODOM GRIND
# -------------------------------
ekf_filter_node_odom:
  ros__parameters:
    # ⚡ How fast we bench-press sensor data
    frequency: 30.0            # Hz – 30-rep burnouts
    two_d_mode: false          # Full 3-D gains, no skipped leg day
    print_diagnostics: true
    debug: false

    # 📐 Frame gains
    map_frame:        map
    odom_frame:       odom
    base_link_frame:  base_link
    world_frame:      odom      # Local pump zone

    # 🚀 LIDAR ODOM (odom0) — main meat-and-potatoes
    odom0: /odometry/lidar
    odom0_config: [false,false,false,   # ✖ pos
                   true, true, true,    # ✔ roll pitch yaw
                   true, true, true,    # ✔ linear vel
                   false,false,false,   # ✖ angular vel
                   false,false,false]   # ✖ linear accel
    odom0_queue_size:   10
    odom0_nodelay:      true   # No lag, no excuses
    odom0_differential: false
    odom0_relative:     true   # Delta reps only

    # 🎥 SLAM ODOM (odom1) — backup spotter
    odom1: slam/odometry
    odom1_config: [false,false,false,
                   true,  true,  true,
                   true,  true,  true,
                   false,false,false,
                   false,false,false]
    odom1_queue_size:   10
    odom1_nodelay:      true
    odom1_differential: false
    odom1_relative:     true

    # 🧭 IMU (imu0) — attitude check
    imu0: imu/data
    imu0_config: [false,false,false,
                  false,false,false,
                  false,false,false,
                  false,false,false,
                  false,false,false]     # muted for now
    imu0_queue_size:                       10
    imu0_nodelay:                          false
    imu0_differential:                     false
    imu0_relative:                         false
    imu0_remove_gravitational_acceleration: true

    publish_tf:         true
    smooth_lagged_data: true
    history_length:     10.0


# -------------------------------
#         EKF  ➜  MAP GAINZ
# -------------------------------
ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 10.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_acceleration: true
    publish_tf: true

    map_frame:        map
    odom_frame:       odom
    base_link_frame:  base_link
    world_frame:      map     

    # 🌎 GPS ODOM (odom0) — geo anchor
    odom0: odometry/gps
    odom0_config: [true, true, false,   # x y
                   false,false,false,
                   false,false,false,
                   false,false,false,
                   false,false,false]
    odom0_queue_size:   10
    odom0_nodelay:      true
    odom0_differential: false
    odom0_relative:     false

    # 🦾 LIDAR ODOM (odom1)
    odom1: odometry/lidar
    odom1_config: [false,false,false,
                   true, true, true,
                   true, true, true,
                   false,false,false,
                   false,false,false]
    odom1_queue_size:   10
    odom1_nodelay:      true
    odom1_differential: false
    odom1_relative:     true

    # 🎥 SLAM ODOM (odom2)
    odom2: slam/odometry
    odom2_config: [false,false,false,
                   true, true, true, # roll pitch yaw
                   true, true, true, # linear vel
                   false,false,false,
                   false,false,false]
    odom2_queue_size:   10
    odom2_nodelay:      true
    odom2_differential: false
    odom2_relative:     true

    smooth_lagged_data: true
    history_length:     10.0


# -------------------------------
#        NAVSAT TRANSFORM
# -------------------------------
navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0                       # Warm-up sync
    magnetic_declination_radians: 0.0
    yaw_offset: 2.14                 # Tiny stance tweak
    zero_altitude: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: true

    # Home turf (Lat, Lon, Alt[m])
    datum: [40.7446795, -74.02789183333333, -14.9]

    smooth_lagged_data: true
    history_length:     10.0
